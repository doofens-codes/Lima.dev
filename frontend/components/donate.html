<section id="donate-page" class="page-container fade-in">
    <div class="donate-container">
        <h2>Support Our Mission</h2>
        <p>Your contribution directly funds our cleaning operations and educational programs.</p>
        
        <div id="donate-error" class="error-message" style="display: none;"></div>
        <div id="donate-success" class="success-message" style="display: none;"></div>

        <form id="donate-form">
            <div class="input-group">
                <label for="donate-amount">Donation Amount ($)</label>
                <input type="number" id="donate-amount" name="amount" min="1" placeholder="e.g., 50" required>
            </div>
            <button type="submit" class="auth-btn">Donate Now</button>
        </form>
    </div>
</section>
